name: Deploy static archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_KEY: leakedintel
      VITE_SITE_BASE_URL: https://desecurity.github.io/Leaked-Intel
      GITHUB_PAGES_BASE: /Leaked-Intel/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: test -f .output/public/index.html && cp .output/public/index.html .output/public/404.html || true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
